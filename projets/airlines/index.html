<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INSEEC Airlines · Guillaume Belle-Croix</title>
<meta name="description" content="INSEEC Airlines, vol IB2026 : film de présentation en 3D réalisé sur Blender, à parcourir au scroll.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--night:#0b0a12;--ink:#f3efe6;--muted:#a49fb3;--line:#2a2638;--orange:#ff7a4d;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink)}
#stage{position:fixed;inset:0;background:var(--night)}
canvas{width:100%;height:100%;display:block}
#track{position:relative}
.hud{position:fixed;z-index:3;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.hud.top{top:max(16px,env(safe-area-inset-top,0px))}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:9px 12px;border:1px solid var(--line);background:rgba(11,10,18,.7)}
.btn:hover{border-color:var(--orange)}
#bar{position:fixed;z-index:4;left:0;top:env(safe-area-inset-top,0px);height:3px;width:0;background:var(--orange)}
#intro{position:fixed;z-index:2;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,rgba(11,10,18,.85),rgba(11,10,18,0));transition:opacity .4s ease;pointer-events:none}
#intro .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
#intro h1{font-family:var(--display);font-weight:900;font-size:clamp(46px,8vw,104px);line-height:.9;text-transform:uppercase;margin:6px 0 8px}
#intro p{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
#load{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="bar"></div>
<div class="hud top"><a class="btn" href="../">← Mes projets</a><span id="load"></span></div>
<div id="intro">
  <div class="k">Projet de cours · Blender · Vol IB2026</div>
  <h1>INSEEC Airlines</h1>
  <p>Faites défiler pour embarquer ↓</p>
</div>
<div id="track"></div>
<script>
const N = 1024, PX = 14;                    // images (1 sur 2 du film à 24 i/s), pixels de scroll par image
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const imgs = new Array(N), ok = new Uint8Array(N);
let DPR = 1, VW = 0, VH = 0, pos = 0, cur = -1, nLoaded = 0;
const track = document.getElementById("track"), intro = document.getElementById("intro"), bar = document.getElementById("bar"), load = document.getElementById("load");
function size(){
  DPR = Math.min(window.devicePixelRatio || 1, 2); VW = innerWidth; VH = innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR; track.style.height = (N * PX + VH) + "px"; cur = -1; draw();
}
function url(i){ return "f/" + String(i).padStart(4, "0") + ".webp"; }
// chargement : d'abord une image sur 16 (aperçu de tout le film), puis 1 sur 4, puis toutes, en priorité autour de la position
const order = []; const seen = new Uint8Array(N);
for (const st of [16, 4, 1]) for (let i = 0; i < N; i += st) if (!seen[i]) { seen[i] = 1; order.push(i); }
let q = 0, active = 0;
function nextIndex(){
  const c = Math.round(pos);
  for (let d = 0; d < 24; d++) for (const i of [c + d, c - d]) if (i >= 0 && i < N && !imgs[i]) return i;
  while (q < order.length && imgs[order[q]]) q++;
  return q < order.length ? order[q] : -1;
}
function pump(){
  while (active < 6){
    const i = nextIndex(); if (i < 0) return;
    const im = new Image(); imgs[i] = im; active++;
    im.decoding = "async";
    im.onload = () => { ok[i] = 1; active--; nLoaded++; load.textContent = nLoaded < N ? Math.round(nLoaded / N * 100) + " %" : ""; if (Math.abs(i - pos) < 3) cur = -1; pump(); };
    im.onerror = () => { active--; pump(); };
    im.src = url(i);
  }
}
function near(i){ for (let d = 0; d < N; d++){ if (i - d >= 0 && ok[i - d]) return i - d; if (i + d < N && ok[i + d]) return i + d; } return -1; }
function cover(im){ const s = Math.max(VW / im.naturalWidth, VH / im.naturalHeight), w = im.naturalWidth * s, h = im.naturalHeight * s; return [(VW - w) / 2, (VH - h) / 2, w, h]; }
function draw(){
  const i0 = Math.floor(pos), t = pos - i0, a = near(i0);
  if (a < 0) return;
  const key = a + ":" + (ok[i0 + 1] && a === i0 ? t.toFixed(3) : 0);
  if (key === cur) return; cur = key;
  const [x, y, w, h] = cover(imgs[a]);
  ctx.globalAlpha = 1; ctx.drawImage(imgs[a], x * DPR, y * DPR, w * DPR, h * DPR);
  if (a === i0 && i0 + 1 < N && ok[i0 + 1] && t > 0.01){ ctx.globalAlpha = t; ctx.drawImage(imgs[i0 + 1], x * DPR, y * DPR, w * DPR, h * DPR); ctx.globalAlpha = 1; }
}
let target = 0;
function onScroll(){ target = Math.min(N - 1, Math.max(0, scrollY / PX)); }
function tick(){
  const d = target - pos; pos = Math.abs(d) < 0.01 ? target : pos + d * 0.18;
  draw(); pump();
  bar.style.width = (pos / (N - 1) * 100) + "%";
  intro.style.opacity = Math.max(0, 1 - scrollY / (VH * 0.5));
  requestAnimationFrame(tick);
}
addEventListener("resize", size); addEventListener("scroll", onScroll, {passive:true});
size(); onScroll(); pump(); requestAnimationFrame(tick);
</script>
</body>
</html>
